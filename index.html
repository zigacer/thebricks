<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <title>Odbojka</title>
  <link rel="stylesheet" href="style.css">
</head>
<body onload="drawIt()">
    <div class="ovoj">
        <div class="rezultati">
            <div class="moder">MODRI: <span id="rezultatModri">0</span></div>
            <div class="rdec">RDEČI: <span id="rezultatRdeci">0</span></div>
        </div>

        <canvas id="canvas" class="igralisce" width="1000" height="500"></canvas>

        <div class="gumbi">
            <button id="gumbStart">Začni</button>
           
        </div>
        <div class="navodila">
    <h3>Navodila</h3>
    <p>
        Igralec MODRI uporablja tipke <b>A</b> (levo) in <b>D</b> (desno)<br>
        Igralec RDEČI uporablja puščici <b>←</b> in <b>→</b><br>
        Cilj igre je odbiti žogo čez mrežo<br>
        Ko žoga pade na tla nasprotnika, dobiš točko<br>
        Zmaga igralec, ki prvi doseže vsaj 5 točk (mora pa zmagati z vsaj dvema točkama razlike)
    </p>
</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="jQuery.js"></script>
    <script src="igra.js"></script>
</body>
</html>
